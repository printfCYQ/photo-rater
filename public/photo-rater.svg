<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Rounded background -->
  <rect x="0" y="0" width="64" height="64" rx="14" fill="#131316"/>
  
  <!-- Camera body -->
  <rect x="10" y="18" width="44" height="28" rx="6" stroke="#0897a8" stroke-width="2.5" fill="none"/>
  
  <!-- Viewfinder hump -->
  <path d="M21 18l-3-7h10l-3 7" stroke="#0897a8" stroke-width="2" fill="none" stroke-linejoin="round"/>
  
  <!-- Lens outer -->
  <circle cx="32" cy="31" r="8" stroke="#0897a8" stroke-width="2.5" fill="none"/>
  <!-- Lens inner -->
  <circle cx="32" cy="31" r="4" stroke="#22d3ee" stroke-width="1.5" fill="none"/>
  <!-- Lens dot -->
  <circle cx="32" cy="31" r="1.5" fill="#22d3ee"/>
  
  <!-- Shutter button -->
  <circle cx="42" cy="13" r="2.5" fill="#0897a8"/>
  
  <!-- Flash -->
  <circle cx="20" cy="13" r="1.5" fill="#0897a8" opacity="0.6"/>
</svg>
