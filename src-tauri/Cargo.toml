[package]
name = "photo-rater"
version = "0.2.0"
description = "Photo Rating & Filtering Desktop App"
authors = ["you"]
edition = "2021"

[lib]
name = "photo_rater_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "macos-private-api"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = "0.25"
walkdir = "2"
rusqlite = { version = "0.31", features = ["bundled"] }
tokio = { version = "1", features = ["full"] }
rayon = "1"
kamadak-exif = "0.5"
log = "0.4"
env_logger = "0.11"
lru = "0.12"
dirs = "5"
chrono = { version = "0.4", features = ["serde"] }
ort = { version = "=2.0.0-rc.13", features = ["download-binaries"] }
ndarray = "0.17"

# Dev builds: global opt-level=1 + high codegen-units keeps compilation fast and low memory.
# Only the JPEG decoder crates get opt-level=2 — where the real decode bottleneck lives.
[profile.dev]
opt-level = 1
codegen-units = 16

[profile.dev.package.zune-jpeg]
opt-level = 2

[profile.dev.package.zune-core]
opt-level = 2
