# 自动在 GitHub 云端 Windows 上构建 Photo Rater 的 Windows 安装包 (.msi / .exe)
#
# 触发方式：
#   1. 打 tag 推送：git tag v0.1.0 && git push origin v0.1.0
#      → 自动构建并将 .msi/.exe 发布到 GitHub Release
#   2. 手动触发：仓库 Actions 页面点击 "Build Windows" → "Run workflow"
#
# 说明：本文件位于仓库根 .github/workflows/ 下。
#       GitHub 的 windows-latest runner 已预装 WiX / NSIS / WebView2，无需额外配置。

name: Build Windows

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  # 项目根目录（本仓库根即 photo-rater）。
  # 若你的 git 仓库根是更上层目录，请将此处改为 'photo-rater'
  PROJECT_DIR: .

jobs:
  build-windows:
    name: Build Windows (.msi / .exe)
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust builds
        uses: swatinem/rust-cache@v2
        with:
          workspaces: '${{ env.PROJECT_DIR }}/src-tauri -> target'

      - name: Install frontend dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        run: pnpm install

      - name: Build Tauri app (Windows)
        working-directory: ${{ env.PROJECT_DIR }}
        run: pnpm tauri build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: photo-rater-windows
          path: |
            ${{ env.PROJECT_DIR }}/src-tauri/target/release/bundle/msi/*.msi
            ${{ env.PROJECT_DIR }}/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: warn

      - name: Publish to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: Photo Rater ${{ github.ref_name }}
          files: |
            ${{ env.PROJECT_DIR }}/src-tauri/target/release/bundle/msi/*.msi
            ${{ env.PROJECT_DIR }}/src-tauri/target/release/bundle/nsis/*.exe
          draft: false
          prerelease: false
